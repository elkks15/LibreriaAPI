<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Prestamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/libros}">BIBLIOTECA</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/vista/libros}">Libros</a>
                <a class="nav-link" th:href="@{/vista/personas}">Usuarios</a>
                <a class="nav-link active" th:href="@{/vista/prestamos}">Prestamos</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administracion</p>
                <h1 class="h2 mb-0">Prestamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Prestar libro</h2>
                    <form th:action="@{/vista/prestamos/guardar}" th:object="${prestamo}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="persona">Usuario</label>
                            <select id="persona" class="form-select" th:field="*{persona.id}" required>
                                <option value="">Selecciona un usuario</option>
                                <option th:each="usuario : ${personas}" th:if="${usuario.estado == 'Activo'}"
                                    th:value="${usuario.id}"
                                    th:text="${usuario.nombre} + ' ' + ${usuario.apellido}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="libro">Libro</label>
                            <select id="libro" class="form-select" th:field="*{libro.isbn}" required>
                                <option value="">Selecciona un libro</option>
                                <option th:each="item : ${libros}" th:if="${item.noEjemplares > 0}"
                                    th:value="${item.isbn}"
                                    th:text="${item.titulo} + ' (' + ${item.noEjemplares} + ' disponibles)'"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="fechaPrestamo">Fecha de prestamo</label>
                            <input id="fechaPrestamo" class="form-control" type="date" th:field="*{fechaPrestamo}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="fechaLimite">Fecha limite</label>
                            <input id="fechaLimite" class="form-control" type="date" th:field="*{fechaLimite}" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Registrar prestamo</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Historial</h2>
                        <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar usuario o libro">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead>
                                <tr>
                                    <th>Folio</th>
                                    <th>Usuario</th>
                                    <th>Libro</th>
                                    <th>Prestamo</th>
                                    <th>Limite</th>
                                    <th>Devolucion</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${prestamos}">
                                    <td th:text="${item.id}"></td>
                                    <td th:text="${item.persona.nombre} + ' ' + ${item.persona.apellido}"></td>
                                    <td th:text="${item.libro.titulo}"></td>
                                    <td th:text="${item.fechaPrestamo}"></td>
                                    <td th:text="${item.fechaLimite}"></td>
                                    <td th:text="${item.fechaDevolucion != null} ? ${item.fechaDevolucion} : '-'"></td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${item.estado == 'Devuelto'} ? 'text-bg-success' : (${item.fechaLimite != null and item.fechaLimite < T(java.time.LocalDate).now()} ? 'text-bg-danger' : 'text-bg-warning')"
                                            th:text="${item.estado == 'Prestado' and item.fechaLimite != null and item.fechaLimite < T(java.time.LocalDate).now()} ? 'Vencido' : ${item.estado}">Prestado</span>
                                    </td>
                                    <td class="text-end text-nowrap">
                                        <form class="d-inline" th:if="${item.estado == 'Prestado'}"
                                            th:action="@{/vista/prestamos/{id}/devolver(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-success btn-sm" type="submit">Devolver</button>
                                        </form>
                                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.id}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/prestamos/{id}/eliminar(id=${item.id})}" method="post">
                                            <button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar este prestamo?')">Eliminar</button>
                                        </form>
                                    </td>
                                    <div class="modal fade" th:id="'editar-' + ${item.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <form th:action="@{/vista/prestamos/{id}/actualizar(id=${item.id})}" method="post">
                                                    <div class="modal-header">
                                                        <h3 class="modal-title fs-5">Editar prestamo</h3>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-label">Usuario</label>
                                                            <input class="form-control" th:value="${item.persona.nombre} + ' ' + ${item.persona.apellido}" disabled>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label">Libro</label>
                                                            <input class="form-control" th:value="${item.libro.titulo}" disabled>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label">Fecha de prestamo</label>
                                                            <input class="form-control" type="date" name="fechaPrestamo" th:value="${item.fechaPrestamo}" required>
                                                        </div>
                                                        <div>
                                                            <label class="form-label">Fecha limite</label>
                                                            <input class="form-control" type="date" name="fechaLimite" th:value="${item.fechaLimite}" required>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                                        <button class="btn btn-primary" type="submit">Guardar cambios</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}">
                                    <td colspan="8" class="text-center text-secondary py-4">No hay prestamos registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
